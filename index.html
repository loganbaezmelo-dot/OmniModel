<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omni-Model Web Studio</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d26;
      --border: #2e3444;
      --accent: #6366f1;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    header {
      padding: 10px 14px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .top-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    select, input, button {
      background: #252a36;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    input[type="password"] { flex: 1; min-width: 130px; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .icon-btn {
      padding: 8px 12px;
      background: #252a36;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      flex-wrap: wrap;
      gap: 6px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
    .status-dot.active { background: #10b981; }
    .get-key-link {
      color: #818cf8;
      text-decoration: none;
      font-weight: 500;
    }

    #sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 99;
      display: none;
    }
    #sidebar-overlay.open { display: block; }
    #sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 280px;
      background: var(--card);
      border-right: 1px solid var(--border);
      z-index: 100;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      display: flex;
      flex-direction: column;
    }
    #sidebar.open { transform: translateX(0); }
    .sidebar-header {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border-radius: 6px;
      background: #252a36;
      cursor: pointer;
      font-size: 13px;
      border: 1px solid transparent;
    }
    .chat-item.active {
      border-color: var(--accent);
      background: #2e3447;
    }
    .chat-item-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .chat-del-btn {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 16px;
      padding: 2px 6px;
      cursor: pointer;
    }

    .nav-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: #151821;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-size: 13px;
    }
    .tab-btn.active {
      color: var(--text);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .view-panel {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
    }
    .view-panel.active { display: flex; }

    #chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 8px;
      max-width: 85%;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
    }
    .input-row {
      display: flex;
      padding: 10px;
      background: var(--card);
      border-top: 1px solid var(--border);
      gap: 8px;
    }
    .input-row textarea {
      flex: 1;
      background: #252a36;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      resize: none;
      height: 44px;
      outline: none;
    }

    #code-editor {
      width: 100%;
      height: 100%;
      background: #090a0f;
      color: #7dd3fc;
      border: none;
      padding: 14px;
      font-family: monospace;
      font-size: 13px;
      resize: none;
      outline: none;
    }

    #preview-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
  <aside id="sidebar">
    <div class="sidebar-header">
      <strong>Saved Sessions</strong>
      <button onclick="createNewSession()">+ New</button>
    </div>
    <div class="sidebar-list" id="sidebar-list"></div>
  </aside>

  <header>
    <div class="top-bar">
      <button class="icon-btn" onclick="toggleSidebar()">☰</button>
      <select id="provider-select" onchange="onProviderChange()">
        <option value="gemini">Gemini</option>
        <option value="openai">OpenAI</option>
        <option value="claude">Claude</option>
      </select>
      <input type="password" id="api-key-input" placeholder="Enter API Key" oninput="saveCurrentKey()">
      <button onclick="fetchModels()">Connect</button>
      <select id="model-select" style="max-width: 150px;">
        <option value="">(No models)</option>
      </select>
    </div>
    <div class="status-row">
      <div class="status">
        <span id="status-indicator" class="status-dot"></span>
        <span id="status-text">Disconnected</span>
      </div>
      <a id="get-key-link" class="get-key-link" href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer">Get Gemini API Key ↗</a>
    </div>
  </header>

  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('chat')">AI Chat</button>
    <button class="tab-btn" onclick="switchTab('code')">Current Code</button>
    <button class="tab-btn" onclick="switchTab('preview')">Live Preview</button>
  </nav>

  <main>
    <div id="view-chat" class="view-panel active">
      <div id="chat-history"></div>
      <div class="input-row">
        <textarea id="prompt-input" placeholder="Prompt AI to edit/create web code..."></textarea>
        <button id="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>

    <div id="view-code" class="view-panel">
      <textarea id="code-editor" spellcheck="false" oninput="onCodeManualEdit()"></textarea>
    </div>

    <div id="view-preview" class="view-panel">
      <iframe id="preview-frame"></iframe>
    </div>
  </main>

  <script>
    const DEFAULT_CODE = "<!DOCTYPE html>\n<html>\n<head>\n  <style>body { font-family: sans-serif; display: grid; place-content: center; height: 90vh; background: #fafafa; color: #222; text-align: center; }</style>\n</head>\n<body>\n  <h2>Ready to Build 🚀</h2>\n  <p>Connect an API key and ask the model to create something!</p>\n</body>\n</html>";

    const KEY_LINKS = {
      gemini: { text: "Get Gemini API Key ↗", url: "https://aistudio.google.com/app/apikey" },
      openai: { text: "Get OpenAI API Key ↗", url: "https://platform.openai.com/api-keys" },
      claude: { text: "Get Claude API Key ↗", url: "https://console.anthropic.com/settings/keys" }
    };

    let sessions = JSON.parse(localStorage.getItem("omni_sessions") || "[]");
    let activeSessionId = localStorage.getItem("omni_active_session_id") || null;

    function saveSessions() {
      localStorage.setItem("omni_sessions", JSON.stringify(sessions));
      localStorage.setItem("omni_active_session_id", activeSessionId);
    }

    function getActiveSession() {
      return sessions.find(s => s.id === activeSessionId);
    }

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("open");
      document.getElementById("sidebar-overlay").classList.toggle("open");
    }

    function renderSidebar() {
      const list = document.getElementById("sidebar-list");
      list.innerHTML = "";
      sessions.forEach(sess => {
        const item = document.createElement("div");
        item.className = `chat-item ${sess.id === activeSessionId ? "active" : ""}`;
        item.onclick = () => switchSession(sess.id);

        const title = document.createElement("span");
        title.className = "chat-item-title";
        title.innerText = sess.title || "Untitled Project";

        const del = document.createElement("button");
        del.className = "chat-del-btn";
        del.innerText = "×";
        del.onclick = (e) => {
          e.stopPropagation();
          deleteSession(sess.id);
        };

        item.appendChild(title);
        item.appendChild(del);
        list.appendChild(item);
      });
    }

    function createNewSession() {
      const newSession = {
        id: "sess_" + Date.now(),
        title: "New Session",
        code: DEFAULT_CODE,
        messages: []
      };
      sessions.unshift(newSession);
      activeSessionId = newSession.id;
      saveSessions();
      loadSessionUI();
      renderSidebar();
      toggleSidebar();
    }

    function switchSession(id) {
      activeSessionId = id;
      saveSessions();
      loadSessionUI();
      renderSidebar();
      toggleSidebar();
    }

    function deleteSession(id) {
      sessions = sessions.filter(s => s.id !== id);
      if (activeSessionId === id) {
        activeSessionId = sessions.length ? sessions[0].id : null;
      }
      if (!sessions.length) {
        createNewSession();
        return;
      }
      saveSessions();
      loadSessionUI();
      renderSidebar();
    }

    function loadSessionUI() {
      const current = getActiveSession();
      if (!current) return;

      const historyDiv = document.getElementById("chat-history");
      historyDiv.innerHTML = "";
      current.messages.forEach(m => {
        const div = document.createElement("div");
        div.className = `msg ${m.role}`;
        div.innerText = m.text;
        historyDiv.appendChild(div);
      });
      historyDiv.scrollTop = historyDiv.scrollHeight;

      document.getElementById("code-editor").value = current.code;
      document.getElementById("preview-frame").srcdoc = current.code;
    }

    function onCodeManualEdit() {
      const current = getActiveSession();
      if (!current) return;
      current.code = document.getElementById("code-editor").value;
      document.getElementById("preview-frame").srcdoc = current.code;
      saveSessions();
    }

    function saveCurrentKey() {
      const provider = document.getElementById("provider-select").value;
      const key = document.getElementById("api-key-input").value.trim();
      localStorage.setItem(`omni_key_${provider}`, key);
    }

    function onProviderChange() {
      const provider = document.getElementById("provider-select").value;
      const keyInput = document.getElementById("api-key-input");
      const linkEl = document.getElementById("get-key-link");
      const select = document.getElementById("model-select");

      keyInput.value = localStorage.getItem(`omni_key_${provider}`) || "";
      linkEl.innerText = KEY_LINKS[provider].text;
      linkEl.href = KEY_LINKS[provider].url;

      select.innerHTML = '<option value="">(No models)</option>';
      document.getElementById("status-indicator").classList.remove("active");
      document.getElementById("status-text").innerText = "Key loaded. Click Connect.";

      if (keyInput.value) {
        fetchModels();
      }
    }

    function switchTab(name) {
      document.querySelectorAll(".tab-btn").forEach((b, idx) => {
        b.classList.toggle("active", ['chat', 'code', 'preview'][idx] === name);
      });
      document.querySelectorAll(".view-panel").forEach(p => p.classList.remove("active"));
      document.getElementById("view-" + name).classList.add("active");
      if (name === "preview") {
        const current = getActiveSession();
        if (current) document.getElementById("preview-frame").srcdoc = current.code;
      }
    }

    async function fetchModels() {
      const provider = document.getElementById("provider-select").value;
      const key = document.getElementById("api-key-input").value.trim();
      const modelSelect = document.getElementById("model-select");
      const statusText = document.getElementById("status-text");
      const statusDot = document.getElementById("status-indicator");

      if (!key) return alert("Please enter an API key.");
      saveCurrentKey();

      statusText.innerText = "Discovering models...";
      modelSelect.innerHTML = '<option value="">Loading...</option>';

      try {
        let models = [];
        let modelVersionMap = {};

        if (provider === "gemini") {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);

          data.models.forEach(m => {
            const cleanId = m.name.replace("models/", "");
            if (m.supportedGenerationMethods?.includes("generateContent")) {
              models.push(cleanId);
              modelVersionMap[cleanId] = m.displayName || m.version || "";
            }
          });
        } else if (provider === "openai") {
          const res = await fetch("https://api.openai.com/v1/models", {
            headers: { "Authorization": `Bearer ${key}` }
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          models = data.data
            .map(m => m.id)
            .filter(id => id.includes("gpt"))
            .sort((a, b) => b.localeCompare(a));
        } else if (provider === "claude") {
          const res = await fetch("https://api.anthropic.com/v1/models", {
            headers: {
              "x-api-key": key,
              "anthropic-version": "2023-06-01",
              "anthropic-dangerous-direct-browser-access": "true"
            }
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          models = data.data ? data.data.map(m => m.id) : ["claude-3-5-sonnet-latest", "claude-3-opus-latest"];
        }

        modelSelect.innerHTML = "";
        models = models.filter(m => !m.includes("-tts") && !m.includes("-clip") && !m.includes("lyria"));

        models.forEach(m => {
          const opt = document.createElement("option");
          opt.value = m;
          opt.textContent = m;
          modelSelect.appendChild(opt);
        });

        const targetModel = models.find(m => m === "gemini-pro-latest")
                         || models.find(m => m.includes("pro-latest"))
                         || models.find(m => m.includes("pro"))
                         || models.find(m => m.includes("flash"))
                         || models[0];

        if (targetModel) modelSelect.value = targetModel;

        statusDot.classList.add("active");
        const extra = modelVersionMap[modelSelect.value];
        statusText.innerText = extra && extra !== modelSelect.value 
          ? `Connected: ${modelSelect.value} (${extra})`
          : `Connected: ${modelSelect.value}`;

      } catch (err) {
        modelSelect.innerHTML = '<option value="">(Error)</option>';
        statusDot.classList.remove("active");
        statusText.innerText = "Error fetching models: " + err.message;
        alert("Failed to connect: " + err.message);
      }
    }

    async function sendMessage() {
      const promptInput = document.getElementById("prompt-input");
      const prompt = promptInput.value.trim();
      const key = document.getElementById("api-key-input").value.trim();
      const provider = document.getElementById("provider-select").value;
      const model = document.getElementById("model-select").value;
      const current = getActiveSession();

      if (!prompt) return;
      if (!key || !model) return alert("Please connect your API key and select a model first.");
      if (!current) return;

      if (!current.messages.length) {
        current.title = prompt.slice(0, 24) + (prompt.length > 24 ? "..." : "");
        renderSidebar();
      }

      current.messages.push({ role: "user", text: prompt });
      appendChat("user", prompt);
      promptInput.value = "";
      saveSessions();

      const systemPrompt = `You are a frontend web development assistant.
You MUST output full, self-contained HTML (including CSS and JavaScript inside <style> and <script> tags).
Return ONLY the raw HTML code block enclosed in triple backticks (\`\`\`html ... \`\`\`) with a brief explanation.
Here is the current HTML code the user has in the editor right now:
\`\`\`html
${current.code}
\`\`\``;

      appendChat("assistant", "Generating update...");
      const historyDiv = document.getElementById("chat-history");
      const loadingMsg = historyDiv.lastElementChild;

      try {
        let reply = "";

        if (provider === "gemini") {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ role: "user", parts: [{ text: systemPrompt + "\n\nUser Request: " + prompt }] }]
            })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          reply = data.candidates[0].content.parts[0].text;
        } else if (provider === "openai") {
          const res = await fetch("https://api.openai.com/v1/chat/completions", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${key}`
            },
            body: JSON.stringify({
              model: model,
              messages: [
                { role: "system", content: systemPrompt },
                { role: "user", content: prompt }
              ]
            })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          reply = data.choices[0].message.content;
        } else if (provider === "claude") {
          const res = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-key": key,
              "anthropic-version": "2023-06-01",
              "anthropic-dangerous-direct-browser-access": "true"
            },
            body: JSON.stringify({
              model: model,
              system: systemPrompt,
              max_tokens: 4096,
              messages: [{ role: "user", content: prompt }]
            })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          reply = data.content[0].text;
        }

        loadingMsg.innerText = reply;
        current.messages.push({ role: "assistant", text: reply });

        const codeMatch = reply.match(/```html\s*([\s\S]*?)\s*```/) || reply.match(/```\s*([\s\S]*?)\s*```/);
        if (codeMatch && codeMatch[1]) {
          current.code = codeMatch[1].trim();
          document.getElementById("code-editor").value = current.code;
          document.getElementById("preview-frame").srcdoc = current.code;
        }
        saveSessions();

      } catch (err) {
        loadingMsg.innerText = "Error: " + err.message;
      }
    }

    function appendChat(role, text) {
      const history = document.getElementById("chat-history");
      const msg = document.createElement("div");
      msg.className = `msg ${role}`;
      msg.innerText = text;
      history.appendChild(msg);
      history.scrollTop = history.scrollHeight;
    }

    if (!sessions.length) {
      createNewSession();
    } else {
      if (!activeSessionId) activeSessionId = sessions[0].id;
      loadSessionUI();
      renderSidebar();
    }

    onProviderChange();
  </script>
</body>
</html>
