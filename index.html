<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omni-Model Web Studio</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d26;
      --border: #2e3444;
      --accent: #6366f1;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --danger: #ef4444;
      --success: #10b981;
      --gh-dark: #24292f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    header {
      padding: 10px 14px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .top-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    select, input, button {
      background: #252a36;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    input[type="password"], input[type="text"] { flex: 1; min-width: 130px; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .icon-btn {
      padding: 8px 12px;
      background: #252a36;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .export-btn { background: #10b981; }
    .github-btn { background: #238636; }
    
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      flex-wrap: wrap;
      gap: 6px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
    .status-dot.active { background: #10b981; }
    .get-key-link {
      color: #818cf8;
      text-decoration: none;
      font-weight: 500;
    }

    /* Sidebar Drawer */
    #sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 99;
      display: none;
    }
    #sidebar-overlay.open { display: block; }
    #sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 320px;
      background: var(--card);
      border-right: 1px solid var(--border);
      z-index: 100;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      display: flex;
      flex-direction: column;
    }
    #sidebar.open { transform: translateX(0); }
    .sidebar-header {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border-radius: 6px;
      background: #252a36;
      cursor: pointer;
      font-size: 13px;
      border: 1px solid transparent;
    }
    .chat-item.active {
      border-color: var(--accent);
      background: #2e3447;
    }
    .chat-item-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .chat-del-btn {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 16px;
      padding: 2px 6px;
      cursor: pointer;
    }

    /* GitHub Section in Sidebar */
    .sidebar-section {
      padding: 12px;
      border-top: 1px solid var(--border);
      background: #151821;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sidebar-section h4 {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .gh-inputs {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .gh-inputs input {
      font-size: 12px;
      padding: 6px 10px;
    }
    .gh-btns {
      display: flex;
      gap: 6px;
    }
    .gh-btns button {
      flex: 1;
      padding: 6px 8px;
      font-size: 12px;
    }

    /* Rules inside Sidebar */
    .rules-textarea {
      width: 100%;
      height: 60px;
      background: #252a36;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      resize: none;
      outline: none;
      font-family: monospace;
    }

    /* Tabs (Mobile only) */
    .nav-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: #151821;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-size: 13px;
    }
    .tab-btn.active {
      color: var(--text);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    /* Workspace Panels */
    main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .view-panel {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
    }
    .view-panel.active { display: flex; }

    .panel-header {
      display: none;
      padding: 8px 12px;
      background: #151821;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      justify-content: space-between;
      align-items: center;
    }

    /* Diff Review Banner */
    #diff-banner {
      display: none;
      padding: 8px 12px;
      background: #1e293b;
      border-bottom: 1px solid var(--border);
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      gap: 10px;
    }
    .diff-actions {
      display: flex;
      gap: 6px;
    }
    .btn-apply {
      background: var(--success);
      padding: 4px 10px;
      font-size: 12px;
    }
    .btn-discard {
      background: var(--danger);
      padding: 4px 10px;
      font-size: 12px;
    }

    /* Runtime Error Banner */
    #error-banner {
      display: none;
      padding: 8px 12px;
      background: rgba(239, 68, 68, 0.2);
      border-bottom: 1px solid var(--danger);
      color: #fca5a5;
      font-size: 12px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    #error-banner button {
      background: var(--danger);
      padding: 4px 10px;
      font-size: 12px;
      white-space: nowrap;
    }

    #chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 8px;
      max-width: 85%;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
    }
    .input-row {
      display: flex;
      padding: 10px;
      background: var(--card);
      border-top: 1px solid var(--border);
      gap: 8px;
    }
    .input-row textarea {
      flex: 1;
      background: #252a36;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      resize: none;
      height: 44px;
      outline: none;
    }

    #code-editor {
      width: 100%;
      height: 100%;
      background: #090a0f;
      color: #7dd3fc;
      border: none;
      padding: 14px;
      font-family: monospace;
      font-size: 13px;
      resize: none;
      outline: none;
    }

    .preview-toolbar {
      padding: 6px 12px;
      background: #151821;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }
    .inspect-toggle-btn {
      padding: 4px 10px;
      font-size: 12px;
      background: #252a36;
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .inspect-toggle-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    #preview-frame {
      width: 100%;
      flex: 1;
      border: none;
      background: #ffffff;
    }

    /* Desktop View */
    @media (min-width: 900px) {
      .nav-tabs {
        display: none;
      }
      main {
        display: grid;
        grid-template-columns: 360px 1fr 1fr;
        height: 100%;
      }
      .view-panel {
        position: relative !important;
        inset: auto !important;
        display: flex !important;
        border-right: 1px solid var(--border);
      }
      .view-panel:last-child {
        border-right: none;
      }
      .panel-header {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
  <aside id="sidebar">
    <div class="sidebar-header">
      <strong>Saved Sessions</strong>
      <button onclick="createNewSession()">+ New</button>
    </div>
    <div class="sidebar-list" id="sidebar-list"></div>

    <!-- GitHub Integration Panel -->
    <div class="sidebar-section">
      <h4>GitHub Sync (Direct Git) <a href="https://github.com/settings/tokens?type=beta" target="_blank" style="color:var(--accent); text-decoration:none;">Get Token ↗</a></h4>
      <div class="gh-inputs">
        <input type="password" id="gh-token" placeholder="GitHub Personal Access Token (repo)" oninput="saveGhConfig()">
        <input type="text" id="gh-repo" placeholder="owner/repo (e.g. user/my-app)" oninput="saveGhConfig()">
        <input type="text" id="gh-path" placeholder="File Path (e.g. index.html)" value="index.html" oninput="saveGhConfig()">
      </div>
      <div class="gh-btns">
        <button class="icon-btn" onclick="pullFromGitHub()">⬇ Pull</button>
        <button class="github-btn" onclick="pushToGitHub()">⬆ Commit & Push</button>
      </div>
    </div>
    
    <!-- Cursorrules Config -->
    <div class="sidebar-section">
      <h4>Global Rules (.cursorrules)</h4>
      <textarea id="rules-input" class="rules-textarea" placeholder="e.g. Always use Tailwind CSS, mobile responsive..." oninput="saveRules()"></textarea>
    </div>
  </aside>

  <header>
    <div class="top-bar">
      <button class="icon-btn" onclick="toggleSidebar()">☰</button>
      <select id="provider-select" onchange="onProviderChange()">
        <option value="gemini">Gemini</option>
        <option value="openai">OpenAI</option>
        <option value="claude">Claude</option>
      </select>
      <input type="password" id="api-key-input" placeholder="Enter API Key" oninput="saveCurrentKey()">
      <button onclick="fetchModels()">Connect</button>
      <select id="model-select" style="max-width: 150px;">
        <option value="">(No models)</option>
      </select>
      <button class="export-btn" onclick="exportProject()">Export ⤓</button>
    </div>
    <div class="status-row">
      <div class="status">
        <span id="status-indicator" class="status-dot"></span>
        <span id="status-text">Disconnected</span>
      </div>
      <a id="get-key-link" class="get-key-link" href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer">Get Gemini API Key ↗</a>
    </div>
  </header>

  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('chat')">AI Chat</button>
    <button class="tab-btn" onclick="switchTab('code')">Current Code</button>
    <button class="tab-btn" onclick="switchTab('preview')">Live Preview</button>
  </nav>

  <main>
    <div id="view-chat" class="view-panel active">
      <div class="panel-header">AI Chat</div>
      <div id="chat-history"></div>
      <div class="input-row">
        <textarea id="prompt-input" placeholder="Prompt AI to edit/create web code..."></textarea>
        <button id="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>

    <div id="view-code" class="view-panel">
      <div class="panel-header">Current Code</div>
      <div id="diff-banner">
        <span>⚠️ Generated Changes Pending</span>
        <div class="diff-actions">
          <button class="btn-apply" onclick="acceptDiff()">Apply</button>
          <button class="btn-discard" onclick="rejectDiff()">Discard</button>
        </div>
      </div>
      <textarea id="code-editor" spellcheck="false" oninput="onCodeManualEdit()"></textarea>
    </div>

    <div id="view-preview" class="view-panel">
      <div class="panel-header">Live Preview</div>
      <div class="preview-toolbar">
        <span>Sandbox Canvas</span>
        <button id="inspect-toggle-btn" class="inspect-toggle-btn" onclick="toggleInspector()">🔍 Inspect Element</button>
      </div>
      <div id="error-banner">
        <span id="error-banner-text">Error occurred</span>
        <button onclick="fixCurrentError()">Fix with AI 🪄</button>
      </div>
      <iframe id="preview-frame" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
    </div>
  </main>

  <script>
    const DEFAULT_CODE = "<!DOCTYPE html>\n<html>\n<head>\n  <style>body { font-family: sans-serif; display: grid; place-content: center; height: 90vh; background: #fafafa; color: #222; text-align: center; }</style>\n</head>\n<body>\n  <h2>Ready to Build 🚀</h2>\n  <p>Connect an API key and ask the model to create something!</p>\n</body>\n</html>";

    const KEY_LINKS = {
      gemini: { text: "Get Gemini API Key ↗", url: "https://aistudio.google.com/app/apikey" },
      openai: { text: "Get OpenAI API Key ↗", url: "https://platform.openai.com/api-keys" },
      claude: { text: "Get Claude API Key ↗", url: "https://console.anthropic.com/settings/keys" }
    };

    let sessions = JSON.parse(localStorage.getItem("omni_sessions") || "[]");
    let activeSessionId = localStorage.getItem("omni_active_session_id") || null;
    let pendingDiffCode = null;
    let preDiffSnapshot = null;
    let isInspectorActive = false;
    let lastCapturedError = null;
    let currentFileSha = null;

    // --- GitHub Configuration & REST Sync ---
    function loadGhConfig() {
      document.getElementById("gh-token").value = localStorage.getItem("omni_gh_token") || "";
      document.getElementById("gh-repo").value = localStorage.getItem("omni_gh_repo") || "";
      document.getElementById("gh-path").value = localStorage.getItem("omni_gh_path") || "index.html";
    }

    function saveGhConfig() {
      localStorage.setItem("omni_gh_token", document.getElementById("gh-token").value.trim());
      localStorage.setItem("omni_gh_repo", document.getElementById("gh-repo").value.trim());
      localStorage.setItem("omni_gh_path", document.getElementById("gh-path").value.trim());
    }

    async function pullFromGitHub() {
      const token = document.getElementById("gh-token").value.trim();
      const repo = document.getElementById("gh-repo").value.trim();
      const path = document.getElementById("gh-path").value.trim();

      if (!token || !repo || !path) return alert("Please fill in Token, Repo (owner/repo), and File Path.");

      const statusText = document.getElementById("status-text");
      statusText.innerText = "Pulling from GitHub...";

      try {
        const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github+json"
          }
        });
        const data = await res.json();
        if (data.message && !res.ok) throw new Error(data.message);

        currentFileSha = data.sha;
        const decodedContent = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ""))));

        const current = getActiveSession();
        if (current) {
          current.code = decodedContent;
          saveSessions();
          document.getElementById("code-editor").value = decodedContent;
          renderSandboxPreview(decodedContent);
        }

        statusText.innerText = `Pulled ${path} (${data.sha.slice(0,7)})`;
        alert(`Successfully pulled ${path} from ${repo}!`);
        toggleSidebar();
      } catch (err) {
        statusText.innerText = "GitHub pull failed";
        alert("GitHub Pull Error: " + err.message);
      }
    }

    async function pushToGitHub() {
      const token = document.getElementById("gh-token").value.trim();
      const repo = document.getElementById("gh-repo").value.trim();
      const path = document.getElementById("gh-path").value.trim();
      const current = getActiveSession();

      if (!token || !repo || !path) return alert("Please enter GitHub Token, Repo (owner/repo), and File Path.");
      if (!current) return;

      const commitMsg = window.prompt("Commit Message:", "Update from Omni Studio");
      if (!commitMsg) return;

      const statusText = document.getElementById("status-text");
      statusText.innerText = "Pushing commit to GitHub...";

      try {
        // Fetch current SHA if not cached
        if (!currentFileSha) {
          const checkRes = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
            headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json" }
          });
          if (checkRes.ok) {
            const checkData = await checkRes.json();
            currentFileSha = checkData.sha;
          }
        }

        const encodedContent = btoa(unescape(encodeURIComponent(current.code)));
        const bodyPayload = {
          message: commitMsg,
          content: encodedContent
        };
        if (currentFileSha) bodyPayload.sha = currentFileSha;

        const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify(bodyPayload)
        });

        const putData = await putRes.json();
        if (putData.message && !putRes.ok) throw new Error(putData.message);

        currentFileSha = putData.content?.sha || null;
        statusText.innerText = `Pushed commit: ${commitMsg}`;
        alert(`Successfully pushed to ${repo}/${path}!`);
        toggleSidebar();
      } catch (err) {
        statusText.innerText = "GitHub push failed";
        alert("GitHub Push Error: " + err.message);
      }
    }

    // --- Cursorrules Management ---
    function loadRules() {
      const rules = localStorage.getItem("omni_cursorrules") || "Always write clean, self-contained HTML/CSS/JS in a single file with responsive design.";
      document.getElementById("rules-input").value = rules;
    }
    function saveRules() {
      localStorage.setItem("omni_cursorrules", document.getElementById("rules-input").value);
    }

    // --- Sessions Management ---
    function saveSessions() {
      localStorage.setItem("omni_sessions", JSON.stringify(sessions));
      localStorage.setItem("omni_active_session_id", activeSessionId);
    }

    function getActiveSession() {
      return sessions.find(s => s.id === activeSessionId);
    }

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("open");
      document.getElementById("sidebar-overlay").classList.toggle("open");
    }

    function renderSidebar() {
      const list = document.getElementById("sidebar-list");
      list.innerHTML = "";
      sessions.forEach(sess => {
        const item = document.createElement("div");
        item.className = `chat-item ${sess.id === activeSessionId ? "active" : ""}`;
        item.onclick = () => switchSession(sess.id);

        const title = document.createElement("span");
        title.className = "chat-item-title";
        title.innerText = sess.title || "Untitled Project";

        const del = document.createElement("button");
        del.className = "chat-del-btn";
        del.innerText = "×";
        del.onclick = (e) => {
          e.stopPropagation();
          deleteSession(sess.id);
        };

        item.appendChild(title);
        item.appendChild(del);
        list.appendChild(item);
      });
    }

    function createNewSession() {
      const newSession = {
        id: "sess_" + Date.now(),
        title: "New Session",
        code: DEFAULT_CODE,
        messages: []
      };
      sessions.unshift(newSession);
      activeSessionId = newSession.id;
      currentFileSha = null;
      pendingDiffCode = null;
      document.getElementById("diff-banner").style.display = "none";
      document.getElementById("error-banner").style.display = "none";
      saveSessions();
      loadSessionUI();
      renderSidebar();
      if (document.getElementById("sidebar").classList.contains("open")) {
        toggleSidebar();
      }
    }

    function switchSession(id) {
      activeSessionId = id;
      currentFileSha = null;
      pendingDiffCode = null;
      document.getElementById("diff-banner").style.display = "none";
      document.getElementById("error-banner").style.display = "none";
      saveSessions();
      loadSessionUI();
      renderSidebar();
      if (document.getElementById("sidebar").classList.contains("open")) {
        toggleSidebar();
      }
    }

    function deleteSession(id) {
      sessions = sessions.filter(s => s.id !== id);
      if (activeSessionId === id) {
        activeSessionId = sessions.length ? sessions[0].id : null;
      }
      if (!sessions.length) {
        createNewSession();
        return;
      }
      saveSessions();
      loadSessionUI();
      renderSidebar();
    }

    function loadSessionUI() {
      const current = getActiveSession();
      if (!current) return;

      const historyDiv = document.getElementById("chat-history");
      historyDiv.innerHTML = "";
      current.messages.forEach(m => {
        const div = document.createElement("div");
        div.className = `msg ${m.role}`;
        div.innerText = m.text;
        historyDiv.appendChild(div);
      });
      historyDiv.scrollTop = historyDiv.scrollHeight;

      document.getElementById("code-editor").value = current.code;
      renderSandboxPreview(current.code);
    }

    function onCodeManualEdit() {
      const current = getActiveSession();
      if (!current) return;
      current.code = document.getElementById("code-editor").value;
      renderSandboxPreview(current.code);
      saveSessions();
    }

    // --- Live Sandbox with Error Injection & Inspector Hook ---
    function renderSandboxPreview(rawHtml) {
      document.getElementById("error-banner").style.display = "none";
      const iframe = document.getElementById("preview-frame");

      const injectedHooks = `
        <script>
          window.onerror = function(msg, url, line, col, error) {
            window.parent.postMessage({ type: 'OMNI_RUNTIME_ERROR', error: msg + ' (Line ' + line + ')' }, '*');
            return false;
          };

          window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'OMNI_SET_INSPECT_MODE') {
              window.__inspectActive = e.data.active;
            }
          });

          let prevEl = null;
          document.addEventListener('mouseover', function(e) {
            if (!window.__inspectActive) return;
            if (prevEl) prevEl.style.outline = '';
            prevEl = e.target;
            prevEl.style.outline = '2px dashed #6366f1';
          }, true);

          document.addEventListener('click', function(e) {
            if (!window.__inspectActive) return;
            e.preventDefault();
            e.stopPropagation();
            if (prevEl) prevEl.style.outline = '';
            const tag = e.target.tagName.toLowerCase();
            const id = e.target.id ? '#' + e.target.id : '';
            const cls = e.target.className ? '.' + String(e.target.className).trim().replace(/\\s+/g, '.') : '';
            const snippet = e.target.outerHTML.slice(0, 180);
            window.parent.postMessage({ 
              type: 'OMNI_ELEMENT_INSPECTED', 
              selector: tag + id + cls,
              outerHTML: snippet
            }, '*');
          }, true);
        <\/script>
      `;

      iframe.srcdoc = rawHtml + injectedHooks;
    }

    window.addEventListener("message", (e) => {
      if (!e.data) return;

      if (e.data.type === "OMNI_RUNTIME_ERROR") {
        lastCapturedError = e.data.error;
        const banner = document.getElementById("error-banner");
        document.getElementById("error-banner-text").innerText = `⚠️ ${lastCapturedError}`;
        banner.style.display = "flex";
      }

      if (e.data.type === "OMNI_ELEMENT_INSPECTED") {
        const input = document.getElementById("prompt-input");
        input.value = `@element (${e.data.selector}):\n\`\`\`html\n${e.data.outerHTML}\n\`\`\`\nModify this element: `;
        toggleInspector(false);
        switchTab("chat");
        input.focus();
      }
    });

    function toggleInspector(forceState) {
      isInspectorActive = forceState !== undefined ? forceState : !isInspectorActive;
      const btn = document.getElementById("inspect-toggle-btn");
      btn.classList.toggle("active", isInspectorActive);
      btn.innerText = isInspectorActive ? "Cancel Inspect" : "🔍 Inspect Element";
      
      const iframe = document.getElementById("preview-frame");
      if (iframe && iframe.contentWindow) {
        iframe.contentWindow.postMessage({ type: "OMNI_SET_INSPECT_MODE", active: isInspectorActive }, "*");
      }
    }

    function fixCurrentError() {
      if (!lastCapturedError) return;
      const promptInput = document.getElementById("prompt-input");
      promptInput.value = `Fix this runtime console error occurring in the code:\n"${lastCapturedError}"`;
      switchTab("chat");
      sendMessage();
    }

    function promptDiffReview(newCode) {
      preDiffSnapshot = document.getElementById("code-editor").value;
      pendingDiffCode = newCode;
      document.getElementById("diff-banner").style.display = "flex";
      document.getElementById("code-editor").value = newCode;
      renderSandboxPreview(newCode);
      switchTab("code");
    }

    function acceptDiff() {
      const current = getActiveSession();
      if (!current || !pendingDiffCode) return;
      current.code = pendingDiffCode;
      saveSessions();
      pendingDiffCode = null;
      document.getElementById("diff-banner").style.display = "none";
      renderSandboxPreview(current.code);
    }

    function rejectDiff() {
      const current = getActiveSession();
      if (!current) return;
      document.getElementById("code-editor").value = preDiffSnapshot;
      renderSandboxPreview(preDiffSnapshot);
      pendingDiffCode = null;
      document.getElementById("diff-banner").style.display = "none";
    }

    function exportProject() {
      const current = getActiveSession();
      if (!current) return;
      const blob = new Blob([current.code], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = (current.title ? current.title.replace(/[^a-z0-9]/gi, "_").toLowerCase() : "index") + ".html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function saveCurrentKey() {
      const provider = document.getElementById("provider-select").value;
      const key = document.getElementById("api-key-input").value.trim();
      localStorage.setItem(`omni_key_${provider}`, key);
    }

    function onProviderChange() {
      const provider = document.getElementById("provider-select").value;
      const keyInput = document.getElementById("api-key-input");
      const linkEl = document.getElementById("get-key-link");
      const select = document.getElementById("model-select");

      keyInput.value = localStorage.getItem(`omni_key_${provider}`) || "";
      linkEl.innerText = KEY_LINKS[provider].text;
      linkEl.href = KEY_LINKS[provider].url;

      select.innerHTML = '<option value="">(No models)</option>';
      document.getElementById("status-indicator").classList.remove("active");
      document.getElementById("status-text").innerText = "Key loaded. Click Connect.";

      if (keyInput.value) fetchModels();
    }

    function switchTab(name) {
      document.querySelectorAll(".tab-btn").forEach((b, idx) => {
        b.classList.toggle("active", ['chat', 'code', 'preview'][idx] === name);
      });
      document.querySelectorAll(".view-panel").forEach(p => p.classList.remove("active"));
      document.getElementById("view-" + name).classList.add("active");
    }

    async function fetchModels() {
      const provider = document.getElementById("provider-select").value;
      const key = document.getElementById("api-key-input").value.trim();
      const modelSelect = document.getElementById("model-select");
      const statusText = document.getElementById("status-text");
      const statusDot = document.getElementById("status-indicator");

      if (!key) return alert("Please enter an API key.");
      saveCurrentKey();

      statusText.innerText = "Discovering models...";
      modelSelect.innerHTML = '<option value="">Loading...</option>';

      try {
        let models = [];
        let modelVersionMap = {};

        if (provider === "gemini") {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);

          data.models.forEach(m => {
            const cleanId = m.name.replace("models/", "");
            if (m.supportedGenerationMethods?.includes("generateContent")) {
              models.push(cleanId);
              modelVersionMap[cleanId] = m.displayName || m.version || "";
            }
          });
        } else if (provider === "openai") {
          const res = await fetch("https://api.openai.com/v1/models", {
            headers: { "Authorization": `Bearer ${key}` }
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          models = data.data
            .map(m => m.id)
            .filter(id => id.includes("gpt"))
            .sort((a, b) => b.localeCompare(a));
        } else if (provider === "claude") {
          const res = await fetch("https://api.anthropic.com/v1/models", {
            headers: {
              "x-api-key": key,
              "anthropic-version": "2023-06-01",
              "anthropic-dangerous-direct-browser-access": "true"
            }
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          models = data.data ? data.data.map(m => m.id) : ["claude-3-5-sonnet-latest", "claude-3-opus-latest"];
        }

        modelSelect.innerHTML = "";
        models = models.filter(m => !m.includes("-tts") && !m.includes("-clip") && !m.includes("lyria"));

        models.forEach(m => {
          const opt = document.createElement("option");
          opt.value = m;
          opt.textContent = m;
          modelSelect.appendChild(opt);
        });

        const targetModel = models.find(m => m === "gemini-pro-latest")
                         || models.find(m => m.includes("pro-latest"))
                         || models.find(m => m.includes("pro"))
                         || models.find(m => m.includes("flash"))
                         || models[0];

        if (targetModel) modelSelect.value = targetModel;

        statusDot.classList.add("active");
        const extra = modelVersionMap[modelSelect.value];
        statusText.innerText = extra && extra !== modelSelect.value 
          ? `Connected: ${modelSelect.value} (${extra})`
          : `Connected: ${modelSelect.value}`;

      } catch (err) {
        modelSelect.innerHTML = '<option value="">(Error)</option>';
        statusDot.classList.remove("active");
        statusText.innerText = "Error fetching models: " + err.message;
        alert("Failed to connect: " + err.message);
      }
    }

    async function sendMessage() {
      const promptInput = document.getElementById("prompt-input");
      const prompt = promptInput.value.trim();
      const key = document.getElementById("api-key-input").value.trim();
      const provider = document.getElementById("provider-select").value;
      const model = document.getElementById("model-select").value;
      const current = getActiveSession();
      const customRules = localStorage.getItem("omni_cursorrules") || "";

      if (!prompt) return;
      if (!key || !model) return alert("Please connect your API key and select a model first.");
      if (!current) return;

      if (!current.messages.length) {
        current.title = prompt.slice(0, 24) + (prompt.length > 24 ? "..." : "");
        renderSidebar();
      }

      current.messages.push({ role: "user", text: prompt });
      appendChat("user", prompt);
      promptInput.value = "";
      saveSessions();

      const systemPrompt = `You are a frontend web development assistant.
Project Rules (.cursorrules):
${customRules}

You MUST output full, self-contained HTML (including CSS and JavaScript inside <style> and <script> tags).
Return ONLY the raw HTML code block enclosed in triple backticks (\`\`\`html ... \`\`\`) with a brief explanation.
Here is the current HTML code the user has in the editor right now:
\`\`\`html
${current.code}
\`\`\``;

      appendChat("assistant", "Generating update...");
      const historyDiv = document.getElementById("chat-history");
      const loadingMsg = historyDiv.lastElementChild;

      try {
        let reply = "";

        if (provider === "gemini") {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ role: "user", parts: [{ text: systemPrompt + "\n\nUser Request: " + prompt }] }]
            })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          reply = data.candidates[0].content.parts[0].text;
        } else if (provider === "openai") {
          const res = await fetch("https://api.openai.com/v1/chat/completions", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${key}`
            },
            body: JSON.stringify({
              model: model,
              messages: [
                { role: "system", content: systemPrompt },
                { role: "user", content: prompt }
              ]
            })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          reply = data.choices[0].message.content;
        } else if (provider === "claude") {
          const res = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-key": key,
              "anthropic-version": "2023-06-01",
              "anthropic-dangerous-direct-browser-access": "true"
            },
            body: JSON.stringify({
              model: model,
              system: systemPrompt,
              max_tokens: 4096,
              messages: [{ role: "user", content: prompt }]
            })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          reply = data.content[0].text;
        }

        loadingMsg.innerText = reply;
        current.messages.push({ role: "assistant", text: reply });

        const codeMatch = reply.match(/```html\s*([\s\S]*?)\s*```/) || reply.match(/```\s*([\s\S]*?)\s*```/);
        if (codeMatch && codeMatch[1]) {
          promptDiffReview(codeMatch[1].trim());
        }
        saveSessions();

      } catch (err) {
        loadingMsg.innerText = "Error: " + err.message;
      }
    }

    function appendChat(role, text) {
      const history = document.getElementById("chat-history");
      const msg = document.createElement("div");
      msg.className = `msg ${role}`;
      msg.innerText = text;
      history.appendChild(msg);
      history.scrollTop = history.scrollHeight;
    }

    loadRules();
    loadGhConfig();

    if (!sessions.length) {
      createNewSession();
    } else {
      if (!activeSessionId) activeSessionId = sessions[0].id;
      loadSessionUI();
      renderSidebar();
    }

    onProviderChange();
  </script>
</body>
</html>
