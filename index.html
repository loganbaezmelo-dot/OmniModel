<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omni-Model Web Studio</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d26;
      --border: #2e3444;
      --accent: #6366f1;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    header {
      padding: 10px 14px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .top-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    select, input, button {
      background: #252a36;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    optgroup {
      background: #1a1d26;
      color: var(--accent);
      font-weight: bold;
    }
    option {
      background: #252a36;
      color: var(--text);
      font-weight: normal;
    }
    input[type="password"], input[type="text"] { flex: 1; min-width: 130px; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .icon-btn {
      padding: 8px 12px;
      background: #252a36;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .export-btn { background: #10b981; }
    .github-btn { background: #238636; }
    
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      flex-wrap: wrap;
      gap: 6px;
    }
    .status { display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
    .status-dot.active { background: #10b981; }
    .get-key-link { color: #818cf8; text-decoration: none; font-weight: 500; }

    /* Sidebar Drawer */
    #sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 99;
      display: none;
    }
    #sidebar-overlay.open { display: block; }
    #sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 320px;
      background: var(--card);
      border-right: 1px solid var(--border);
      z-index: 100;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      display: flex;
      flex-direction: column;
    }
    #sidebar.open { transform: translateX(0); }
    .sidebar-header {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border-radius: 6px;
      background: #252a36;
      cursor: pointer;
      font-size: 13px;
      border: 1px solid transparent;
    }
    .chat-item.active { border-color: var(--accent); background: #2e3447; }
    .chat-item-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .chat-del-btn { background: none; border: none; color: var(--danger); font-size: 16px; padding: 2px 6px; cursor: pointer; }

    .sidebar-section {
      padding: 12px;
      border-top: 1px solid var(--border);
      background: #151821;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sidebar-section h4 {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .gh-inputs { display: flex; flex-direction: column; gap: 6px; }
    .gh-inputs input { font-size: 12px; padding: 6px 10px; }
    .gh-btns { display: flex; gap: 6px; }
    .gh-btns button { flex: 1; padding: 6px 8px; font-size: 12px; }
    .rules-textarea {
      width: 100%;
      height: 60px;
      background: #252a36;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      resize: none;
      outline: none;
      font-family: monospace;
    }

    /* Navigation Tabs */
    .nav-tabs { display: flex; border-bottom: 1px solid var(--border); background: #151821; }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-size: 13px;
    }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

    /* Workspace Panels */
    main { flex: 1; position: relative; overflow: hidden; }
    .view-panel { position: absolute; inset: 0; display: none; flex-direction: column; }
    .view-panel.active { display: flex; }

    .panel-header {
      padding: 8px 12px;
      background: #151821;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Virtual File Tree Bar */
    .file-tree-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      background: #0f1117;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .file-pill {
      font-size: 12px;
      padding: 4px 8px;
      background: #1a1d26;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .file-pill.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .file-pill-del { font-size: 11px; opacity: 0.7; }
    .file-pill-del:hover { opacity: 1; }

    .history-controls { display: flex; align-items: center; gap: 4px; }
    .history-btn { padding: 2px 8px; font-size: 11px; background: #252a36; }

    /* Autonomous Verification & Notification Banner */
    #diff-banner {
      display: none;
      padding: 8px 12px;
      background: #1e293b;
      border-bottom: 1px solid var(--border);
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      gap: 10px;
    }
    .diff-actions { display: flex; gap: 6px; }
    .btn-apply { background: var(--success); padding: 4px 10px; font-size: 12px; }
    .btn-discard { background: var(--danger); padding: 4px 10px; font-size: 12px; }

    /* Runtime Error Banner */
    #error-banner {
      display: none;
      padding: 8px 12px;
      background: rgba(239, 68, 68, 0.2);
      border-bottom: 1px solid var(--danger);
      color: #fca5a5;
      font-size: 12px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    #error-banner button { background: var(--danger); padding: 4px 10px; font-size: 12px; white-space: nowrap; }

    #chat-history { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 14px; border-radius: 8px; max-width: 85%; font-size: 14px; line-height: 1.4; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
    .msg.assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--border); }
    .msg img { max-width: 100%; border-radius: 6px; margin-top: 6px; }

    .image-preview-bar {
      display: none;
      padding: 6px 12px;
      background: #151821;
      border-top: 1px solid var(--border);
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .image-preview-bar img { height: 32px; width: 32px; object-fit: cover; border-radius: 4px; }
    .image-preview-bar span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .input-row {
      display: flex;
      padding: 10px;
      background: var(--card);
      border-top: 1px solid var(--border);
      gap: 6px;
      align-items: center;
    }
    .input-row textarea {
      flex: 1;
      background: #252a36;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      resize: none;
      height: 44px;
      outline: none;
    }
    .media-btn {
      padding: 10px 12px;
      background: #252a36;
      border: 1px solid var(--border);
      font-size: 16px;
      display: grid;
      place-content: center;
    }
    .media-btn.recording {
      background: var(--danger);
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }

    #code-editor {
      width: 100%;
      height: 100%;
      background: #090a0f;
      color: #7dd3fc;
      border: none;
      padding: 14px;
      font-family: monospace;
      font-size: 13px;
      resize: none;
      outline: none;
    }

    .preview-container {
      flex: 1;
      background: #1e222d;
      display: flex;
      justify-content: center;
      align-items: stretch;
      overflow: auto;
      position: relative;
    }
    #preview-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
      transition: width 0.2s ease;
    }
    .viewport-pill {
      padding: 2px 6px;
      font-size: 11px;
      background: #252a36;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
    }
    .viewport-pill.active { background: var(--accent); color: #fff; }

    @media (min-width: 900px) {
      .nav-tabs { display: none; }
      main { display: grid; grid-template-columns: 380px 1fr 1fr; height: 100%; }
      .view-panel { position: relative !important; inset: auto !important; display: flex !important; border-right: 1px solid var(--border); }
      .view-panel:last-child { border-right: none; }
    }
  </style>
</head>
<body>

  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
  <aside id="sidebar">
    <div class="sidebar-header">
      <strong>Saved Sessions</strong>
      <button onclick="createNewSession()">+ New</button>
    </div>
    <div class="sidebar-list" id="sidebar-list"></div>

    <div class="sidebar-section">
      <h4>GitHub Sync (Direct Git) <a href="https://github.com/settings/tokens?type=beta" target="_blank" style="color:var(--accent); text-decoration:none;">Get Token ↗</a></h4>
      <div class="gh-inputs">
        <input type="password" id="gh-token" placeholder="GitHub PAT (repo scope)" oninput="saveGhConfig()">
        <input type="text" id="gh-repo" placeholder="owner/repo" oninput="saveGhConfig()">
        <input type="text" id="gh-path" placeholder="File Path" value="index.html" oninput="saveGhConfig()">
      </div>
      <div class="gh-btns">
        <button class="icon-btn" onclick="pullFromGitHub()">⬇ Pull</button>
        <button class="github-btn" onclick="pushToGitHub()">⬆ Commit & Push</button>
      </div>
    </div>
    
    <div class="sidebar-section">
      <h4>Global Rules (.cursorrules)</h4>
      <textarea id="rules-input" class="rules-textarea" placeholder="e.g. Always use Tailwind, mobile responsive..." oninput="saveRules()"></textarea>
    </div>
  </aside>

  <header>
    <div class="top-bar">
      <button class="icon-btn" onclick="toggleSidebar()">☰</button>
      <select id="provider-select" onchange="onProviderChange()">
        <option value="gemini">Gemini</option>
        <option value="openai">OpenAI</option>
        <option value="claude">Claude</option>
        <option value="openrouter">OpenRouter</option>
        <option value="groq">Groq</option>
      </select>
      <input type="password" id="api-key-input" placeholder="Enter API Key" oninput="saveCurrentKey()">
      <button onclick="fetchModels()">Connect</button>
      <select id="model-select" style="max-width: 170px;">
        <option value="">(No models)</option>
      </select>
      <button class="export-btn" onclick="exportProject()">Export ⤓</button>
    </div>
    <div class="status-row">
      <div class="status">
        <span id="status-indicator" class="status-dot"></span>
        <span id="status-text">Disconnected</span>
      </div>
      <a id="get-key-link" class="get-key-link" href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer">Get Gemini API Key ↗</a>
    </div>
  </header>

  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('chat')">AI Chat</button>
    <button class="tab-btn" onclick="switchTab('code')">Code & Files</button>
    <button class="tab-btn" onclick="switchTab('preview')">Live Preview</button>
  </nav>

  <main>
    <!-- View: Chat -->
    <div id="view-chat" class="view-panel active">
      <div class="panel-header">
        <span>AI Assistant</span>
        <div class="history-controls">
          <button class="history-btn" onclick="undoSnapshot()" title="Rollback edit">↩ Undo</button>
          <button class="history-btn" onclick="redoSnapshot()" title="Redo edit">↪ Redo</button>
        </div>
      </div>
      <div id="chat-history"></div>
      
      <div id="image-preview-bar" class="image-preview-bar">
        <img id="attached-thumb" src="" alt="Attached Preview">
        <span id="attached-name">image.png</span>
        <button class="icon-btn" style="padding:2px 6px;" onclick="clearAttachedImage()">×</button>
      </div>

      <div class="input-row">
        <input type="file" id="file-uploader" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
        <button class="media-btn" title="Attach wireframe or UI screenshot" onclick="document.getElementById('file-uploader').click()">📎</button>
        <button id="voice-btn" class="media-btn" title="Voice to Code" onclick="toggleVoiceInput()">🎙️</button>
        <textarea id="prompt-input" placeholder="Prompt AI to code, edit, or fix..."></textarea>
        <button id="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>

    <!-- View: Multi-File Code Editor -->
    <div id="view-code" class="view-panel">
      <div class="panel-header">
        <span>Files & Code</span>
        <button class="icon-btn" style="padding:2px 8px; font-size:11px;" onclick="promptNewFile()">+ File</button>
      </div>
      
      <div id="file-tree-bar" class="file-tree-bar"></div>
      <textarea id="code-editor" spellcheck="false" oninput="onCodeManualEdit()"></textarea>
    </div>

    <!-- View: Live Preview Canvas -->
    <div id="view-preview" class="view-panel">
      <div class="panel-header">
        <div style="display:flex; gap:4px; align-items:center;">
          <span>Canvas</span>
          <button id="inspect-toggle-btn" class="icon-btn" style="padding:2px 6px; font-size:11px;" onclick="toggleInspector()">🔍 Inspect</button>
        </div>
        <div style="display:flex; gap:4px;">
          <button class="viewport-pill" onclick="setViewport('375px', this)">📱 375</button>
          <button class="viewport-pill" onclick="setViewport('768px', this)">💻 768</button>
          <button class="viewport-pill active" onclick="setViewport('100%', this)">🖥️ 100%</button>
        </div>
      </div>
      
      <!-- Autonomous Auto-Verification Banner -->
      <div id="diff-banner"></div>

      <div id="error-banner">
        <span id="error-banner-text">Error occurred</span>
        <button onclick="fixCurrentError()">Fix with AI 🪄</button>
      </div>
      <div class="preview-container">
        <iframe id="preview-frame" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
      </div>
    </div>
  </main>

  <script>
    const DEFAULT_PROJECT = {
      "index.html": "<!DOCTYPE html>\n<html>\n<head>\n  <link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n  <h2>Omni Studio 🚀</h2>\n  <p>Multi-file project ready!</p>\n  <script src=\"script.js\"><\/script>\n</body>\n</html>",
      "styles.css": "body {\n  font-family: sans-serif;\n  display: grid;\n  place-content: center;\n  height: 90vh;\n  background: #fafafa;\n  color: #222;\n  text-align: center;\n}",
      "script.js": "console.log('Omni app loaded.');"
    };

    const KEY_LINKS = {
      gemini: { text: "Get Gemini API Key ↗", url: "https://aistudio.google.com/app/apikey" },
      openai: { text: "Get OpenAI API Key ↗", url: "https://platform.openai.com/api-keys" },
      claude: { text: "Get Claude API Key ↗", url: "https://console.anthropic.com/settings/keys" },
      openrouter: { text: "Get OpenRouter Key ↗", url: "https://openrouter.ai/keys" },
      groq: { text: "Get Groq API Key ↗", url: "https://console.groq.com/keys" }
    };

    let sessions = JSON.parse(localStorage.getItem("omni_sessions") || "[]");
    let activeSessionId = localStorage.getItem("omni_active_session_id") || null;
    let activeFileName = "index.html";
    let isInspectorActive = false;
    let lastCapturedError = null;
    let currentFileSha = null;
    let attachedImage = null;
    let speechRecognizer = null;
    let isRecording = false;

    function captureSnapshot() {
      const current = getActiveSession();
      if (!current) return;
      if (!current.history) current.history = [];
      if (current.historyIdx === undefined) current.historyIdx = -1;
      current.history = current.history.slice(0, current.historyIdx + 1);
      current.history.push(JSON.parse(JSON.stringify(current.files)));
      current.historyIdx = current.history.length - 1;
      saveSessions();
    }

    function undoSnapshot() {
      const current = getActiveSession();
      if (!current || !current.history || current.historyIdx <= 0) return alert("Nothing to undo!");
      current.historyIdx--;
      current.files = JSON.parse(JSON.stringify(current.history[current.historyIdx]));
      saveSessions();
      loadFileEditor();
      renderSandboxPreview();
    }

    function redoSnapshot() {
      const current = getActiveSession();
      if (!current || !current.history || current.historyIdx >= current.history.length - 1) return alert("Nothing to redo!");
      current.historyIdx++;
      current.files = JSON.parse(JSON.stringify(current.history[current.historyIdx]));
      saveSessions();
      loadFileEditor();
      renderSandboxPreview();
    }

    function toggleVoiceInput() {
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Speech) return alert("Speech recognition not supported in this browser.");
      const btn = document.getElementById("voice-btn");
      if (isRecording) {
        speechRecognizer.stop();
        return;
      }
      speechRecognizer = new Speech();
      speechRecognizer.continuous = false;
      speechRecognizer.interimResults = false;
      speechRecognizer.onstart = () => {
        isRecording = true;
        btn.classList.add("recording");
      };
      speechRecognizer.onresult = (evt) => {
        const transcript = evt.results[0][0].transcript;
        const input = document.getElementById("prompt-input");
        input.value = (input.value ? input.value + " " : "") + transcript;
      };
      speechRecognizer.onerror = (e) => console.error("Speech Error:", e);
      speechRecognizer.onend = () => {
        isRecording = false;
        btn.classList.remove("recording");
      };
      speechRecognizer.start();
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const dataUrl = evt.target.result;
        const [meta, base64] = dataUrl.split(",");
        const mimeType = meta.match(/:(.*?);/)[1];
        attachedImage = { base64, mimeType, name: file.name, dataUrl };
        document.getElementById("attached-thumb").src = dataUrl;
        document.getElementById("attached-name").innerText = file.name;
        document.getElementById("image-preview-bar").style.display = "flex";
      };
      reader.readAsDataURL(file);
    }

    function clearAttachedImage() {
      attachedImage = null;
      document.getElementById("file-uploader").value = "";
      document.getElementById("image-preview-bar").style.display = "none";
    }

    function setViewport(width, btn) {
      document.querySelectorAll(".viewport-pill").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("preview-frame").style.width = width;
    }

    function renderFileTree() {
      const current = getActiveSession();
      const treeBar = document.getElementById("file-tree-bar");
      treeBar.innerHTML = "";
      if (!current || !current.files) return;

      Object.keys(current.files).forEach(filename => {
        const pill = document.createElement("div");
        pill.className = `file-pill ${filename === activeFileName ? "active" : ""}`;
        pill.innerHTML = `<span>${filename}</span>`;
        pill.onclick = () => switchFile(filename);

        if (filename !== "index.html") {
          const del = document.createElement("span");
          del.className = "file-pill-del";
          del.innerText = "×";
          del.onclick = (e) => {
            e.stopPropagation();
            deleteFile(filename);
          };
          pill.appendChild(del);
        }
        treeBar.appendChild(pill);
      });
    }

    function switchFile(filename) {
      activeFileName = filename;
      document.getElementById("gh-path").value = filename;
      saveGhConfig();
      renderFileTree();
      loadFileEditor();
    }

    function promptNewFile() {
      const name = window.prompt("New File Name (e.g. app.js, styles.css):");
      if (!name) return;
      const current = getActiveSession();
      if (!current.files[name]) {
        current.files[name] = "";
        captureSnapshot();
        switchFile(name);
      }
    }

    function deleteFile(name) {
      const current = getActiveSession();
      if (confirm(`Delete ${name}?`)) {
        delete current.files[name];
        captureSnapshot();
        switchFile("index.html");
      }
    }

    function loadFileEditor() {
      const current = getActiveSession();
      if (!current || !current.files) return;
      if (!current.files[activeFileName]) activeFileName = "index.html";
      document.getElementById("code-editor").value = current.files[activeFileName] || "";
    }

    function onCodeManualEdit() {
      const current = getActiveSession();
      if (!current) return;
      current.files[activeFileName] = document.getElementById("code-editor").value;
      saveSessions();
      renderSandboxPreview();
    }

    function loadGhConfig() {
      document.getElementById("gh-token").value = localStorage.getItem("omni_gh_token") || "";
      document.getElementById("gh-repo").value = localStorage.getItem("omni_gh_repo") || "";
      document.getElementById("gh-path").value = localStorage.getItem("omni_gh_path") || activeFileName;
    }

    function saveGhConfig() {
      localStorage.setItem("omni_gh_token", document.getElementById("gh-token").value.trim());
      localStorage.setItem("omni_gh_repo", document.getElementById("gh-repo").value.trim());
      localStorage.setItem("omni_gh_path", document.getElementById("gh-path").value.trim());
    }

    async function pullFromGitHub() {
      const token = document.getElementById("gh-token").value.trim();
      const repo = document.getElementById("gh-repo").value.trim();
      const path = document.getElementById("gh-path").value.trim() || activeFileName;
      if (!token || !repo || !path) return alert("Please fill in Token, Repo, and File Path.");
      
      const statusText = document.getElementById("status-text");
      statusText.innerText = `Pulling ${path}...`;

      try {
        const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
          headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json" }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Failed to fetch");

        currentFileSha = data.sha;
        const content = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ""))));

        const current = getActiveSession();
        current.files[path] = content;
        activeFileName = path;
        captureSnapshot();
        loadFileEditor();
        renderFileTree();
        renderSandboxPreview();

        statusText.innerText = `Pulled ${path}`;
        alert(`Successfully pulled ${path} from ${repo}!`);
        toggleSidebar();
      } catch (err) {
        statusText.innerText = "Pull failed";
        alert("GitHub Pull Error: " + err.message);
      }
    }

    async function pushToGitHub() {
      const token = document.getElementById("gh-token").value.trim();
      const repo = document.getElementById("gh-repo").value.trim();
      const path = document.getElementById("gh-path").value.trim() || activeFileName;
      const current = getActiveSession();

      if (!token || !repo || !path) return alert("Please enter GitHub Token, Repo, and File Path.");
      if (!current) return;

      const commitMsg = window.prompt("Commit Message:", `Update ${path} via Omni Studio`);
      if (!commitMsg) return;

      const statusText = document.getElementById("status-text");
      statusText.innerText = "Pushing commit...";

      try {
        if (!currentFileSha) {
          const checkRes = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
            headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json" }
          });
          if (checkRes.ok) {
            const checkData = await checkRes.json();
            currentFileSha = checkData.sha;
          }
        }

        const encodedContent = btoa(unescape(encodeURIComponent(current.files[activeFileName] || "")));
        const bodyPayload = { message: commitMsg, content: encodedContent };
        if (currentFileSha) bodyPayload.sha = currentFileSha;

        const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify(bodyPayload)
        });
        const putData = await putRes.json();
        if (!putRes.ok) throw new Error(putData.message || "Failed to commit");

        currentFileSha = putData.content?.sha || null;
        statusText.innerText = `Pushed: ${commitMsg}`;
        document.getElementById("diff-banner").style.display = "none";
        alert(`Successfully pushed ${path} to ${repo}!`);
      } catch (err) {
        statusText.innerText = "Push failed";
        alert("GitHub Push Error: " + err.message);
      }
    }

    function loadRules() {
      document.getElementById("rules-input").value = localStorage.getItem("omni_cursorrules") || "Always write modern, mobile-friendly code.";
    }
    function saveRules() {
      localStorage.setItem("omni_cursorrules", document.getElementById("rules-input").value);
    }
    function saveSessions() {
      localStorage.setItem("omni_sessions", JSON.stringify(sessions));
      localStorage.setItem("omni_active_session_id", activeSessionId);
    }
    function getActiveSession() {
      return sessions.find(s => s.id === activeSessionId);
    }
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("open");
      document.getElementById("sidebar-overlay").classList.toggle("open");
    }

    function renderSidebar() {
      const list = document.getElementById("sidebar-list");
      list.innerHTML = "";
      sessions.forEach(sess => {
        const item = document.createElement("div");
        item.className = `chat-item ${sess.id === activeSessionId ? "active" : ""}`;
        item.onclick = () => switchSession(sess.id);

        const title = document.createElement("span");
        title.className = "chat-item-title";
        title.innerText = sess.title || "Untitled Project";

        const del = document.createElement("button");
        del.className = "chat-del-btn";
        del.innerText = "×";
        del.onclick = (e) => { e.stopPropagation(); deleteSession(sess.id); };

        item.appendChild(title);
        item.appendChild(del);
        list.appendChild(item);
      });
    }

    function createNewSession() {
      const newSession = {
        id: "sess_" + Date.now(),
        title: "New Project",
        files: JSON.parse(JSON.stringify(DEFAULT_PROJECT)),
        history: [JSON.parse(JSON.stringify(DEFAULT_PROJECT))],
        historyIdx: 0,
        messages: []
      };
      sessions.unshift(newSession);
      activeSessionId = newSession.id;
      activeFileName = "index.html";
      saveSessions();
      loadSessionUI();
      renderSidebar();
      if (document.getElementById("sidebar").classList.contains("open")) toggleSidebar();
    }

    function switchSession(id) {
      activeSessionId = id;
      activeFileName = "index.html";
      saveSessions();
      loadSessionUI();
      renderSidebar();
      if (document.getElementById("sidebar").classList.contains("open")) toggleSidebar();
    }

    function deleteSession(id) {
      sessions = sessions.filter(s => s.id !== id);
      activeSessionId = sessions.length ? sessions[0].id : null;
      if (!sessions.length) { createNewSession(); return; }
      saveSessions();
      loadSessionUI();
      renderSidebar();
    }

    function loadSessionUI() {
      const current = getActiveSession();
      if (!current) return;
      if (!current.files) current.files = { "index.html": current.code || DEFAULT_PROJECT["index.html"] };
      if (!current.history) {
        current.history = [JSON.parse(JSON.stringify(current.files))];
        current.historyIdx = 0;
      }

      const historyDiv = document.getElementById("chat-history");
      historyDiv.innerHTML = "";
      current.messages.forEach(m => {
        const div = document.createElement("div");
        div.className = `msg ${m.role}`;
        div.innerText = m.text;
        if (m.img) {
          const im = document.createElement("img");
          im.src = m.img;
          div.appendChild(im);
        }
        historyDiv.appendChild(div);
      });
      historyDiv.scrollTop = historyDiv.scrollHeight;

      renderFileTree();
      loadFileEditor();
      renderSandboxPreview();
    }

    function renderSandboxPreview() {
      document.getElementById("error-banner").style.display = "none";
      const current = getActiveSession();
      if (!current || !current.files) return;

      let html = current.files["index.html"] || "";

      Object.keys(current.files).forEach(fn => {
        if (fn.endsWith(".css")) {
          const cssRegex = new RegExp(`<link[^>]+href=["']${fn}["'][^>]*>`, "gi");
          html = html.replace(cssRegex, `<style>/* ${fn} */\n${current.files[fn]}\n</style>`);
        }
        if (fn.endsWith(".js") && fn !== "index.html") {
          const jsRegex = new RegExp(`<script[^>]+src=["']${fn}["'][^>]*><\\/script>`, "gi");
          html = html.replace(jsRegex, `<script>/* ${fn} */\n${current.files[fn]}\n<\/script>`);
        }
      });

      const injectedHooks = `
        <script>
          window.onerror = function(msg, url, line) {
            window.parent.postMessage({ type: 'OMNI_RUNTIME_ERROR', error: msg + ' (Line ' + line + ')' }, '*');
            return false;
          };
          window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'OMNI_SET_INSPECT_MODE') window.__inspectActive = e.data.active;
          });
          let prevEl = null;
          document.addEventListener('mouseover', function(e) {
            if (!window.__inspectActive) return;
            if (prevEl) prevEl.style.outline = '';
            prevEl = e.target;
            prevEl.style.outline = '2px dashed #6366f1';
          }, true);
          document.addEventListener('click', function(e) {
            if (!window.__inspectActive) return;
            e.preventDefault(); e.stopPropagation();
            if (prevEl) prevEl.style.outline = '';
            const tag = e.target.tagName.toLowerCase();
            const id = e.target.id ? '#' + e.target.id : '';
            const cls = e.target.className ? '.' + String(e.target.className).trim().replace(/\\s+/g, '.') : '';
            window.parent.postMessage({ 
              type: 'OMNI_ELEMENT_INSPECTED', 
              selector: tag + id + cls,
              outerHTML: e.target.outerHTML.slice(0, 180)
            }, '*');
          }, true);
        <\/script>
      `;

      document.getElementById("preview-frame").srcdoc = html + injectedHooks;
    }

    // --- Autonomous Verification Routine ---
    function triggerAutonomousVerification() {
      const banner = document.getElementById("diff-banner");
      banner.style.display = "none";

      const token = localStorage.getItem("omni_gh_token");
      const repo = localStorage.getItem("omni_gh_repo");
      lastCapturedError = null;

      // Allow 1 second for DOM mounting and script execution
      setTimeout(() => {
        if (lastCapturedError) {
          console.warn("Autonomous verification flagged runtime error:", lastCapturedError);
          return;
        }

        if (token && repo) {
          banner.style.display = "flex";
          banner.style.background = "#064e3b";
          banner.innerHTML = `
            <span>✅ Build verified (0 errors). Push ${activeFileName} to GitHub?</span>
            <div class="diff-actions">
              <button class="btn-apply" onclick="pushToGitHub()">⬆ Commit & Push</button>
              <button class="btn-discard" onclick="document.getElementById('diff-banner').style.display='none'">Dismiss</button>
            </div>
          `;
          switchTab("preview");
        }
      }, 1000);
    }

    window.addEventListener("message", (e) => {
      if (!e.data) return;
      if (e.data.type === "OMNI_RUNTIME_ERROR") {
        lastCapturedError = e.data.error;
        document.getElementById("error-banner-text").innerText = `⚠️ ${lastCapturedError}`;
        document.getElementById("error-banner").style.display = "flex";
        document.getElementById("diff-banner").style.display = "none";
      }
      if (e.data.type === "OMNI_ELEMENT_INSPECTED") {
        const input = document.getElementById("prompt-input");
        input.value = `@element (${e.data.selector}):\n\`\`\`html\n${e.data.outerHTML}\n\`\`\`\nModify this: `;
        toggleInspector(false);
        switchTab("chat");
        input.focus();
      }
    });

    function toggleInspector(forceState) {
      isInspectorActive = forceState !== undefined ? forceState : !isInspectorActive;
      const btn = document.getElementById("inspect-toggle-btn");
      btn.style.background = isInspectorActive ? "var(--accent)" : "#252a36";
      const iframe = document.getElementById("preview-frame");
      if (iframe && iframe.contentWindow) {
        iframe.contentWindow.postMessage({ type: "OMNI_SET_INSPECT_MODE", active: isInspectorActive }, "*");
      }
    }

    function fixCurrentError() {
      if (!lastCapturedError) return;
      const promptInput = document.getElementById("prompt-input");
      promptInput.value = `Fix this runtime console error occurring in ${activeFileName}:\n"${lastCapturedError}"`;
      switchTab("chat");
      sendMessage();
    }

    function exportProject() {
      const current = getActiveSession();
      if (!current) return;
      const blob = new Blob([current.files["index.html"]], { type: "text/html;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (current.title ? current.title.replace(/[^a-z0-9]/gi, "_").toLowerCase() : "index") + ".html";
      a.click();
    }

    function saveCurrentKey() {
      const provider = document.getElementById("provider-select").value;
      localStorage.setItem(`omni_key_${provider}`, document.getElementById("api-key-input").value.trim());
    }

    function onProviderChange() {
      const provider = document.getElementById("provider-select").value;
      const keyInput = document.getElementById("api-key-input");
      keyInput.value = localStorage.getItem(`omni_key_${provider}`) || "";
      document.getElementById("get-key-link").innerText = KEY_LINKS[provider].text;
      document.getElementById("get-key-link").href = KEY_LINKS[provider].url;
      if (keyInput.value) fetchModels();
    }

    function switchTab(name) {
      document.querySelectorAll(".tab-btn").forEach((b, idx) => {
        b.classList.toggle("active", ['chat', 'code', 'preview'][idx] === name);
      });
      document.querySelectorAll(".view-panel").forEach(p => p.classList.remove("active"));
      document.getElementById("view-" + name).classList.add("active");
    }

    function extractGptVersion(id) {
      const match = id.match(/gpt-(\d+(?:\.\d+)?)/i);
      return match ? parseFloat(match[1]) : 0;
    }

    async function fetchModels() {
      const provider = document.getElementById("provider-select").value;
      const key = document.getElementById("api-key-input").value.trim();
      const modelSelect = document.getElementById("model-select");
      const statusText = document.getElementById("status-text");
      const statusDot = document.getElementById("status-indicator");

      if (!key) return;
      saveCurrentKey();
      statusText.innerText = "Discovering models...";
      modelSelect.innerHTML = '<option value="">Loading...</option>';

      try {
        let models = [];

        if (provider === "gemini") {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          data.models.forEach(m => {
            if (m.supportedGenerationMethods?.includes("generateContent")) models.push(m.name.replace("models/", ""));
          });
          modelSelect.innerHTML = "";
          models.forEach(m => {
            const opt = document.createElement("option");
            opt.value = m; opt.textContent = m;
            modelSelect.appendChild(opt);
          });
          const target = models.find(m => m.includes("pro-latest")) || models.find(m => m.includes("pro")) || models[0];
          if (target) modelSelect.value = target;

        } else if (provider === "openai") {
          const res = await fetch("https://api.openai.com/v1/models", { headers: { "Authorization": `Bearer ${key}` } });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          models = data.data.map(m => m.id).filter(id => id.toLowerCase().includes("gpt")).sort((a, b) => {
            return extractGptVersion(b) - extractGptVersion(a);
          });
          modelSelect.innerHTML = "";
          models.forEach(m => {
            const opt = document.createElement("option");
            opt.value = m; opt.textContent = m;
            modelSelect.appendChild(opt);
          });
          if (models[0]) modelSelect.value = models[0];

        } else if (provider === "claude") {
          const res = await fetch("https://api.anthropic.com/v1/models", {
            headers: { "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" }
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          models = data.data ? data.data.map(m => m.id) : ["claude-fable-5.1", "claude-3-5-sonnet-latest"];
          modelSelect.innerHTML = "";
          models.forEach(m => {
            const opt = document.createElement("option");
            opt.value = m; opt.textContent = m;
            modelSelect.appendChild(opt);
          });
          const target = models.find(m => m.includes("fable-5.1")) || models.find(m => m.includes("sonnet")) || models[0];
          if (target) modelSelect.value = target;

        } else if (provider === "openrouter") {
          const res = await fetch("https://openrouter.ai/api/v1/models", {
            headers: {
              "Authorization": `Bearer ${key}`,
              "HTTP-Referer": window.location.origin,
              "X-Title": "Omni-Model Studio"
            }
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message || "Failed to load OpenRouter models");

          const excludedBrands = ["google", "openai", "anthropic"];
          const groups = {};

          data.data.forEach(m => {
            const parts = m.id.split("/");
            const rawBrand = parts.length > 1 ? parts[0] : "other";
            const cleanBrand = rawBrand.replace(/[^a-zA-Z0-9_-]/g, "").toLowerCase();

            if (excludedBrands.includes(cleanBrand)) return;

            if (!groups[cleanBrand]) groups[cleanBrand] = [];
            groups[cleanBrand].push(m.id);
          });

          modelSelect.innerHTML = "";

          const priorityBrands = ["deepseek", "meta-llama", "qwen", "mistralai", "cohere", "nousresearch", "x-ai", "moonshotai"];
          const brandKeys = Object.keys(groups).sort((a, b) => {
            const idxA = priorityBrands.indexOf(a);
            const idxB = priorityBrands.indexOf(b);
            if (idxA !== -1 && idxB !== -1) return idxA - idxB;
            if (idxA !== -1) return -1;
            if (idxB !== -1) return 1;
            return a.localeCompare(b);
          });

          brandKeys.forEach(brand => {
            const optgroup = document.createElement("optgroup");
            optgroup.label = brand.toUpperCase();
            groups[brand].sort().forEach(id => {
              const opt = document.createElement("option");
              opt.value = id;
              opt.textContent = id.split("/")[1] || id;
              optgroup.appendChild(opt);
            });
            modelSelect.appendChild(optgroup);
          });

          const defaultTarget = 
            data.data.find(m => m.id.includes("deepseek-v4") || m.id.includes("deepseek-r1") || m.id.includes("deepseek-chat"))?.id ||
            data.data.find(m => m.id.includes("qwen") || m.id.includes("llama"))?.id ||
            modelSelect.querySelector("option")?.value;

          if (defaultTarget) modelSelect.value = defaultTarget;

        } else if (provider === "groq") {
          const res = await fetch("https://api.groq.com/openai/v1/models", {
            headers: { "Authorization": `Bearer ${key}` }
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);

          models = data.data
            .map(m => m.id)
            .filter(id => !id.includes("whisper") && !id.includes("tts"))
            .sort((a, b) => b.localeCompare(a));

          modelSelect.innerHTML = "";
          models.forEach(m => {
            const opt = document.createElement("option");
            opt.value = m; opt.textContent = m;
            modelSelect.appendChild(opt);
          });

          const target = models.find(m => m.includes("llama-3.3-70b")) || models[0];
          if (target) modelSelect.value = target;
        }

        statusDot.classList.add("active");
        statusText.innerText = `Connected: ${modelSelect.value}`;
      } catch (err) {
        statusDot.classList.remove("active");
        statusText.innerText = "Error: " + err.message;
      }
    }

    async function sendMessage() {
      const promptInput = document.getElementById("prompt-input");
      const prompt = promptInput.value.trim();
      const key = document.getElementById("api-key-input").value.trim();
      const provider = document.getElementById("provider-select").value;
      const model = document.getElementById("model-select").value;
      const current = getActiveSession();
      const customRules = localStorage.getItem("omni_cursorrules") || "";

      if (!prompt && !attachedImage) return;
      if (!key || !model) return alert("Please connect an API key first.");
      if (!current) return;

      const userMessageObj = { role: "user", text: prompt, img: attachedImage?.dataUrl || null };
      current.messages.push(userMessageObj);
      appendChat("user", prompt, attachedImage?.dataUrl);
      promptInput.value = "";

      const currentFilesContext = JSON.stringify(current.files, null, 2);
      const systemPrompt = `You are a web development assistant.
Project Rules: ${customRules}
Active File: "${activeFileName}"

All Project Files:
${currentFilesContext}

Return ONLY the updated code for the active file ("${activeFileName}") enclosed in triple backticks (\`\`\`html, \`\`\`css, or \`\`\`javascript).`;

      appendChat("assistant", "Thinking & coding...");
      const historyDiv = document.getElementById("chat-history");
      const loadingMsg = historyDiv.lastElementChild;

      try {
        let reply = "";

        if (provider === "gemini") {
          const parts = [{ text: systemPrompt + "\n\nUser Request: " + prompt }];
          if (attachedImage) {
            parts.push({ inline_data: { mime_type: attachedImage.mimeType, data: attachedImage.base64 } });
          }
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ role: "user", parts }] })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          reply = data.candidates[0].content.parts[0].text;

        } else if (provider === "openai" || provider === "groq" || provider === "openrouter") {
          const endpoint = 
            provider === "groq" ? "https://api.groq.com/openai/v1/chat/completions" :
            provider === "openrouter" ? "https://openrouter.ai/api/v1/chat/completions" :
            "https://api.openai.com/v1/chat/completions";

          const headers = {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${key}`
          };

          if (provider === "openrouter") {
            headers["HTTP-Referer"] = window.location.origin;
            headers["X-Title"] = "Omni-Model Studio";
          }

          const content = [{ type: "text", text: prompt }];
          if (attachedImage) {
            content.push({ 
              type: "image_url", 
              image_url: { url: `data:${attachedImage.mimeType};base64,${attachedImage.base64}` } 
            });
          }

          const res = await fetch(endpoint, {
            method: "POST",
            headers: headers,
            body: JSON.stringify({
              model: model,
              messages: [{ role: "system", content: systemPrompt }, { role: "user", content }]
            })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
          reply = data.choices[0].message.content;

        } else if (provider === "claude") {
          const content = [{ type: "text", text: prompt }];
          if (attachedImage) {
            content.push({
              type: "image",
              source: { type: "base64", media_type: attachedImage.mimeType, data: attachedImage.base64 }
            });
          }
          const res = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-key": key,
              "anthropic-version": "2023-06-01",
              "anthropic-dangerous-direct-browser-access": "true"
            },
            body: JSON.stringify({
              model: model,
              system: systemPrompt,
              max_tokens: 4096,
              messages: [{ role: "user", content }]
            })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          reply = data.content[0].text;
        }

        clearAttachedImage();
        loadingMsg.innerText = reply;
        current.messages.push({ role: "assistant", text: reply });

        const codeMatch = reply.match(/```[a-zA-Z]*\s*([\s\S]*?)\s*```/);
        if (codeMatch && codeMatch[1]) {
          const generatedCode = codeMatch[1].trim();

          // 1. History rollback snapshot
          captureSnapshot();

          // 2. Auto-load code into active file & editor
          current.files[activeFileName] = generatedCode;
          document.getElementById("code-editor").value = generatedCode;
          saveSessions();

          // 3. Mount into live sandbox
          renderSandboxPreview();

          // 4. Trigger autonomous sandbox check & 1-tap push
          triggerAutonomousVerification();
        }
        saveSessions();

      } catch (err) {
        loadingMsg.innerText = "Error: " + err.message;
      }
    }

    function appendChat(role, text, img) {
      const history = document.getElementById("chat-history");
      const msg = document.createElement("div");
      msg.className = `msg ${role}`;
      msg.innerText = text;
      if (img) {
        const im = document.createElement("img");
        im.src = img;
        msg.appendChild(im);
      }
      history.appendChild(msg);
      history.scrollTop = history.scrollHeight;
    }

    loadRules();
    loadGhConfig();

    if (!sessions.length) {
      createNewSession();
    } else {
      if (!activeSessionId) activeSessionId = sessions[0].id;
      loadSessionUI();
      renderSidebar();
    }

    onProviderChange();
  </script>
</body>
